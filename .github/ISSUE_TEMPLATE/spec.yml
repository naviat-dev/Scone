name: Spec
description: An official specification for enhancements.
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to provide us with a detailed specification of your idea.

        In a spec, describe the Electron main-process, renderer, TypeScript, CLI, and packaging changes. Include backwards compatibility and supported OS/architecture combinations.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a concise description of the feature and the motivation for adding it. This can be a modified version from the feature request prior to this.
    validations:
      required: true
  - type: textarea
    id: api-changes
    attributes:
      label: (Public) API Changes
      description: Include the TypeScript APIs, Electron IPC channels, CLI arguments, configuration, and packaging changes required by your proposal.
      value: |
        # [ class ]

        ## Properties

        | API | Description |
        | ------------- | ------------- |
        | [name] | Gets or sets [description]. |

        ## Events

        | API | Description |
        | ------------- | ------------- |
        | [name] | [API documentation/description] |
    validations:
      required: true
  - type: textarea
    id: usage-scenarios
    attributes:
      label: Usage Scenarios
      description: Give us a couple of scenarios that demonstrate how developers would consume the above APIs.
      placeholder: |
        # TypeScript example
        ```ts
        const result = await convertScenery({
          source: inputPath,
          output: outputPath,
        });
        ```
    validations:
      required: true
  - type: textarea
    id: backwards-compatibility
    attributes:
      label: Backward Compatibility
      description: Describe breaking changes, dependency requirements, minimum Electron/Node versions, and support for Windows, macOS, and Linux on x64 and arm64.
      placeholder: |
        Minimum API levels?
        Breaking changes?
        Unsupported platforms?
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      description: What do you feel will be the difficulty of this change all things considering? No exact science, just your gut feeling.
      options:
        - Low
        - Medium
        - High
    validations:
      required: true
name: 🐞 Bug
title: '[BUG] <title>'
description: File a bug report
labels: ["bug", "to verify"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please make sure to add as much detail as you can.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please give a detailed description of the issue that you're seeing. You can add screenshots and videos as well.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to Reproduce
      description: Describe all the steps we need to take to show the behavior that you have observed. Also, include what you expected to happen and what did actually happen.
      placeholder: |
        1. Run `npm run start`.
        2. Open the affected Electron window or workflow.
        3. Observe the problem.

        Expected outcome: describe what should happen.
        Actual outcome: describe what happened.
    validations:
      required: true
  - type: dropdown
    id: platform-with-bug
    attributes:
      label: Platform with bug
      description: Which operating system and CPU architecture show the problem?
      options:
        - Windows
        - macOS
        - Linux
        - All platforms
    validations:
      required: true

  - type: dropdown
    id: platforms-affected
    attributes:
      label: Affected platforms
      description: Select every operating system affected by the issue.
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Other
        - I tested only one platform
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: CPU architecture
      description: Which CPU architecture is affected?
      options:
        - x64
        - arm64
        - Both x64 and arm64
        - Unknown
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Did you find any workaround?
      description: Did you find any workaround for this issue? This can unblock other people while waiting for this issue to be resolved or even give us a hint on how to fix this.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be auomatically formatted into code, so no need for back ticks.
      render: shell

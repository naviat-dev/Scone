name: Electron CI

on:
  push:
    branches:
      - main
      - dev
      - dev-typescript-conversion
      - release/**
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev
      - dev-typescript-conversion
      - release/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            platform: linux
            arch: x64
            runner: ubuntu-24.04
          - os: linux
            platform: linux
            arch: arm64
            runner: ubuntu-24.04-arm
          - os: windows
            platform: win
            arch: x64
            runner: windows-latest
          - os: windows
            platform: win
            arch: arm64
            runner: windows-11-arm
          - os: macos
            platform: mac
            arch: x64
            runner: macos-13
          - os: macos
            platform: mac
            arch: arm64
            runner: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show runtime versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build and package application
        run: npm run package -- --${{ matrix.platform }} --${{ matrix.arch }}

      - name: Verify packaged application
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if ((${#files[@]} == 0)); then
            echo "No packaged application found in dist" >&2
            exit 1
          fi
          printf 'Packaged application output:\n%s\n' "${files[@]}"

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Release
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest=$(git tag -l 'v*' | sort -V | tail -n1)
          if [[ -z "$latest" ]]; then
            next="v0.1.0"
          else
            version=${latest#v}
            IFS='.' read -r major minor patch <<<"$version"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Download application artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          path: dist
          merge-multiple: false

      - name: Archive application artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaged
          for artifact in dist/*; do
            name=$(basename "$artifact")
            zip -r "packaged/${name}.zip" "$artifact"
          done

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: Scone ${{ steps.version.outputs.version }}
          artifacts: packaged/*.zip
          generateReleaseNotes: true

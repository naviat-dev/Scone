name: CI

on:
  push:
    branches:
      - main
      - release/**
      - dev

  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - release/**
      - dev
env:
  STEP_TIMEOUT_MINUTES: 60

jobs:
  build_windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        uses: "./.github/steps/install_dependencies"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Publish Scone Windows ${{ matrix.arch }}
        shell: pwsh
        run: dotnet publish ./Scone/Scone.csproj -c Release -r win-${{ matrix.arch }} /p:PublishProfile=win-${{ matrix.arch }} /p:GltfRepairPkgTargets=node18-win-${{ matrix.arch }}

      - name: Check bundled glTF validator (Windows)
        shell: pwsh
        run: |
          $validator = "./Scone/bin/Release/net10.0-desktop/win-${{ matrix.arch }}/publish/Tools/gltf-validator/windows/gltf_validator.exe"
          if (Test-Path $validator) {
            Write-Host "Found validator: $validator"
          }
          else {
            Write-Host "::warning::Bundled glTF validator not found at $validator"
          }

      - name: Check bundled gltf-repair binary (Windows)
        shell: pwsh
        run: |
          $tool = "./Scone/bin/Release/net10.0-desktop/win-${{ matrix.arch }}/publish/Tools/gltf-repair/gltf-repair-win-${{ matrix.arch }}.exe"
          if (Test-Path $tool) {
            Write-Host "Found gltf-repair: $tool"
          }
          else {
            Write-Error "Bundled gltf-repair binary not found at $tool"
          }

      - name: Upload Windows ${{ matrix.arch }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scone-windows-${{ matrix.arch }}
          path: ./Scone/bin/Release/net10.0-desktop/win-${{ matrix.arch }}/publish/

  build_macos:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        uses: "./.github/steps/install_dependencies"
        with:
          target-platform: 'macos'

      - name: Publish Scone macOS ${{ matrix.arch }}
        shell: bash
        run: dotnet publish ./Scone/Scone.csproj -c Release -r osx-${{ matrix.arch }} --self-contained /p:GltfRepairPkgTargets=node18-macos-${{ matrix.arch }}

      - name: Check bundled glTF validator (macOS)
        shell: bash
        run: |
          set -euo pipefail
          validator="./Scone/bin/Release/net10.0-desktop/osx-${{ matrix.arch }}/publish/Tools/gltf-validator/macos/gltf_validator"
          if [[ -f "$validator" ]]; then
            chmod +x "$validator"
            echo "Found validator: $validator"
          else
            echo "::warning::Bundled glTF validator not found at $validator"
          fi

      - name: Check bundled gltf-repair binary (macOS)
        shell: bash
        run: |
          set -euo pipefail
          tool="./Scone/bin/Release/net10.0-desktop/osx-${{ matrix.arch }}/publish/Tools/gltf-repair/gltf-repair-macos-${{ matrix.arch }}"
          if [[ -f "$tool" ]]; then
            chmod +x "$tool"
            echo "Found gltf-repair: $tool"
          else
            echo "Bundled gltf-repair binary not found at $tool" >&2
            exit 1
          fi

      - name: Upload macOS ${{ matrix.arch }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scone-macos-${{ matrix.arch }}
          path: ./Scone/bin/Release/net10.0-desktop/osx-${{ matrix.arch }}/publish/

  build_linux:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        timeout-minutes: ${{ fromJSON(env.STEP_TIMEOUT_MINUTES) }}
        uses: "./.github/steps/install_dependencies"
        with:
          target-platform: 'linux'

      - name: Publish Scone Linux ${{ matrix.arch }}
        shell: bash
        run: dotnet publish ./Scone/Scone.csproj -c Release -r linux-${{ matrix.arch }} --self-contained /p:GltfRepairPkgTargets=node18-linux-${{ matrix.arch }}

      - name: Check bundled glTF validator (Linux)
        shell: bash
        run: |
          set -euo pipefail
          validator="./Scone/bin/Release/net10.0-desktop/linux-${{ matrix.arch }}/publish/Tools/gltf-validator/linux/gltf_validator"
          if [[ -f "$validator" ]]; then
            chmod +x "$validator"
            echo "Found validator: $validator"
          else
            echo "::warning::Bundled glTF validator not found at $validator"
          fi

      - name: Check bundled gltf-repair binary (Linux)
        shell: bash
        run: |
          set -euo pipefail
          tool="./Scone/bin/Release/net10.0-desktop/linux-${{ matrix.arch }}/publish/Tools/gltf-repair/gltf-repair-linux-${{ matrix.arch }}"
          if [[ -f "$tool" ]]; then
            chmod +x "$tool"
            echo "Found gltf-repair: $tool"
          else
            echo "Bundled gltf-repair binary not found at $tool" >&2
            exit 1
          fi

      - name: Upload Linux ${{ matrix.arch }} Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scone-linux-${{ matrix.arch }}
          path: ./Scone/bin/Release/net10.0-desktop/linux-${{ matrix.arch }}/publish/

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build_windows
      - build_macos
      - build_linux
    permissions:
      contents: write
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          latest=$(git tag -l 'v*' | sort -V | tail -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            version=${latest#v}
            IFS='.' read -r major minor patch <<<"$version"
            patch=$((patch + 1))
            next="v${major}.${minor}.${patch}"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scone-*
          path: dist
          merge-multiple: false

      - name: Package Artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaged
          shopt -s nullglob
          for artifact in dist/*; do
            name=$(basename "$artifact")
            zip -r "packaged/${name}.zip" "$artifact"
          done

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.version }}
          name: Scone ${{ steps.version.outputs.version }}
          artifacts: packaged/*.zip
          generateReleaseNotes: true

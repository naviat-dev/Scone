						<script data-scope="weighted-progress" id="ilpsk">
							(function () {
								const bar = document.querySelector('[data-js="weighted-progress-bar"]');
								if (!bar) return;

								const chunks = [{
									label: "Load",
									weight: 0.1,
									state: "success"
								},
								{
									label: "Convert",
									weight: 2.9,
									state: "success"
								},
								{
									label: "Convert",
									weight: 2.5,
									state: "success"
								},
								{
									label: "Convert",
									weight: 6.5,
									state: "success"
								},
								{
									label: "Process",
									weight: 78,
									state: "running"
								},
								{
									label: "Export",
									weight: 10,
									state: "pending"
								}
								];

								const stateText = {
									pending: "Pending",
									running: "Running",
									success: "Done",
									failed: "Failed"
								};

								function clampWeight(value) {
									const number = Number(value);
									if (!isFinite(number) || number < 0) return 0;
									return number;
								}

								function abbreviate(label) {
									const clean = String(label || "").trim();
									if (clean.length <= 4) return clean;
									const words = clean.split(/\s+/).filter(Boolean);
									if (words.length > 1) return words.map(word => word.charAt(0).toUpperCase()).join("");
									return clean.slice(0, 3);
								}

								function buildSegment(chunk, totalWeight) {
									const safeWeight = clampWeight(chunk.weight);
									const segment = document.createElement('div');
									const widthPercent = totalWeight > 0 ? (safeWeight / totalWeight) * 100 : 0;
									const label = String(chunk.label || "Chunk");
									const state = ["pending", "running", "success", "failed"].includes(chunk.state) ? chunk.state : "pending";

									segment.className = 'weighted-progress-segment ' + state;
									segment.setAttribute('data-gjs-name', 'Progress Segment');
									segment.setAttribute('tabindex', '0');
									segment.style.flexGrow = String(safeWeight || 0.0001);
									segment.style.flexShrink = '1';
									segment.style.flexBasis = '0';
									segment.setAttribute('title', label + ' — ' + safeWeight + '% — ' + stateText[state]);
									segment.setAttribute('aria-label', label + ', ' + safeWeight + ' percent, ' + stateText[state]);

									if (widthPercent < 16) segment.classList.add('tight');
									if (widthPercent < 10) segment.classList.add('micro');
									if (widthPercent < 6) segment.classList.add('nano');

									return segment;
								}

								function renderProgress(list) {
									bar.innerHTML = '';
									const totalWeight = list.reduce((sum, item) => sum + clampWeight(item.weight), 0) || 100;
									const normalizedLabel = list.map(item => (item.label || 'Chunk') + ' ' + clampWeight(item.weight) + '% ' + (item.state || 'pending')).join(', ');
									bar.setAttribute('aria-label', 'Weighted segmented progress: ' + normalizedLabel);

									list.forEach(item => {
										bar.appendChild(buildSegment(item, totalWeight));
									});
								}

								renderProgress(chunks);
							})();
						</script>

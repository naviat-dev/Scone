<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light" />
		<title>Scone</title>
		<link rel="stylesheet" href="renderer.css" />
	</head>
	<body>
		<div class="app-shell">
			<header class="title-bar">
				<div class="title-bar-content">
					<img class="app-logo" src="Assets/logo.png" alt="" />
					<div>
						<h1>Scone</h1>
						<p>Scenery conversion workspace</p>
					</div>
				</div>
			</header>

			<main class="dashboard">
				<aside class="sidebar">
					<nav class="sidebar-navigation" aria-label="Scone sections" role="tablist">
						<button
							id="current-tab"
							class="sidebar-link is-active"
							type="button"
							role="tab"
							aria-selected="true"
							aria-controls="section-host"
							data-section="current"
						>
							<span class="sidebar-link-label">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" />
								</svg>
								<span>Current Conversions</span>
							</span>
							<span id="current-task-count" class="sidebar-link-count">0</span>
						</button>
						<button
							id="history-tab"
							class="sidebar-link"
							type="button"
							role="tab"
							aria-selected="false"
							aria-controls="section-host"
							tabindex="-1"
							data-section="history"
						>
							<span class="sidebar-link-label">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<path d="M3 6.5h7l2 2h9v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" />
								</svg>
								<span>Previous Conversions</span>
							</span>
							<span id="history-task-count" class="sidebar-link-count">0</span>
						</button>
						<button
							id="settings-tab"
							class="sidebar-link"
							type="button"
							role="tab"
							aria-selected="false"
							aria-controls="section-host"
							tabindex="-1"
							data-section="settings"
						>
							<span class="sidebar-link-label">
								<svg viewBox="0 0 24 24" aria-hidden="true">
									<path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7m8.3 4.8-1.7 1 .1 2-2.8 1.6-1.7-1-1.8 1-1.7-1 .1-2-1.7-1v-3.2l1.7-1-.1-2 2.8-1.6 1.7 1 1.8-1 1.7 1-.1 2 1.7 1z" />
								</svg>
								<span>Settings</span>
							</span>
						</button>
					</nav>
				</aside>

				<section class="main-window" aria-live="polite">
					<div id="app-message" class="app-message" role="status" hidden></div>
					<div id="section-host"></div>
				</section>
			</main>
		</div>

		<script type="module" src="dist/renderer.js"></script>
	</body>
</html>
